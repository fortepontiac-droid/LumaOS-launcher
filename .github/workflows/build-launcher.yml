name: Build LumaOS Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract launcher
        run: |
          mkdir extracted
          unzip -q LumaOS-Launcher-1.0.0-Beta.zip -d extracted

      - name: Build APK
        working-directory: extracted/LumaLauncher
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaOS-Launcher-1.0.0-Beta
          path: extracted/LumaLauncher/app/build/outputs/apk/debug/app-debug.apk
          
